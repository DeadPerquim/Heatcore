name: Build and Push game (OCI via Buildpacks)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "tag=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build OCI image with Cloud Native Buildpacks
        uses: buildpacks/github-actions/setup-pack@v5.9.2

      - name: Run pack build
        working-directory: ./
        run: |
          pack build ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} \
            --builder paketobuildpacks/builder-jammy-base \
            --env "BP_NODE_VERSION=24" \
            --path . \
            --publish \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest